<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" role="img">
  <title>AgriBridge architecture</title>
  <desc>Production path: GitHub Actions builds images, a reviewer approves, and a commit records the image tag. Argo CD syncs helm/agribridge from main. Browsers reach the app, Grafana and Argo CD through one Application Load Balancer.</desc>
  <rect width="1180" height="760" fill="#071422"/>
  <text x="590" y="40" text-anchor="middle" fill="#3ddc97" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="28" font-weight="700">AgriBridge architecture</text>

  <rect x="28" y="64" width="360" height="664" rx="16" fill="#0e2436" stroke="#1e4a68"/>
  <text x="48" y="96" fill="#d6e6f5" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="16" font-weight="700">GitHub Actions</text>

  <g font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="14" fill="#e8fff4">
    <rect x="48" y="112" width="220" height="34" rx="8" fill="#145c45"/>
    <text x="158" y="134" text-anchor="middle">Lint and test</text>
    <rect x="48" y="154" width="220" height="34" rx="8" fill="#145c45"/>
    <text x="158" y="176" text-anchor="middle">Gitleaks</text>
    <rect x="48" y="196" width="220" height="34" rx="8" fill="#145c45"/>
    <text x="158" y="218" text-anchor="middle">SonarQube on main</text>
    <rect x="48" y="238" width="220" height="34" rx="8" fill="#145c45"/>
    <text x="158" y="260" text-anchor="middle">Trivy</text>
    <rect x="48" y="280" width="220" height="34" rx="8" fill="#145c45"/>
    <text x="158" y="302" text-anchor="middle">Checkov</text>
    <rect x="48" y="322" width="220" height="34" rx="8" fill="#145c45"/>
    <text x="158" y="344" text-anchor="middle">Build, scan, SBOM</text>
    <rect x="48" y="372" width="320" height="40" rx="8" fill="#c4551a"/>
    <text x="208" y="397" text-anchor="middle" fill="#fff">Docker Hub on main</text>
    <rect x="48" y="424" width="320" height="40" rx="8" fill="#6b3f12"/>
    <text x="208" y="449" text-anchor="middle" fill="#fff">production environment approval</text>
    <rect x="48" y="476" width="320" height="48" rx="8" fill="#c4551a"/>
    <text x="208" y="498" text-anchor="middle" fill="#fff">Commit image tags on main</text>
    <text x="208" y="514" text-anchor="middle" fill="#ffe1cc" font-size="12">[skip ci] · DeucesDevops</text>
    <text x="48" y="552" fill="#9eb6c9" font-size="13">Pull requests and dev stop after the scans.</text>
    <text x="48" y="574" fill="#9eb6c9" font-size="13">They do not push images or change the tag.</text>
    <text x="48" y="620" fill="#9eb6c9" font-size="13">Argo CD reads main. The approval is the</text>
    <text x="48" y="642" fill="#9eb6c9" font-size="13">gate before the desired tag changes.</text>
  </g>

  <path d="M368 500 H410" stroke="#f0a36a" stroke-width="2" fill="none"/>
  <polygon points="410,494 422,500 410,506" fill="#f0a36a"/>

  <rect x="430" y="64" width="722" height="664" rx="16" fill="#0e2436" stroke="#1e4a68"/>
  <text x="450" y="96" fill="#d6e6f5" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="16" font-weight="700">AWS · kOps cluster k8s.agribridge.deuces.dev</text>
  <text x="450" y="118" fill="#9eb6c9" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="13">1 t3.medium control plane · 2 t3.large workers · rendered with kops --target=terraform</text>

  <g font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="14">
    <rect x="450" y="138" width="100" height="36" rx="8" fill="#12324c" stroke="#7eb6e6"/>
    <text x="500" y="161" text-anchor="middle" fill="#e7f3ff">Browser</text>
    <rect x="570" y="138" width="110" height="36" rx="8" fill="#c4551a"/>
    <text x="625" y="161" text-anchor="middle" fill="#fff">Route 53</text>
    <rect x="700" y="138" width="170" height="36" rx="8" fill="#1d4e89"/>
    <text x="785" y="161" text-anchor="middle" fill="#fff">ALB + ACM</text>
    <text x="890" y="154" fill="#9eb6c9" font-size="12">instance targets</text>
    <text x="890" y="170" fill="#9eb6c9" font-size="12">group agribridge</text>
    <path d="M550 156 H570" stroke="#f0a36a" stroke-width="2"/>
    <path d="M680 156 H700" stroke="#f0a36a" stroke-width="2"/>

    <rect x="450" y="196" width="660" height="58" rx="8" fill="#6b3f12"/>
    <text x="780" y="220" text-anchor="middle" fill="#fff">Argo CD · argocd.agribridge.deuces.dev · NodePort</text>
    <text x="780" y="240" text-anchor="middle" fill="#f3d7b0" font-size="12">tracks main · helm/agribridge · automated sync, prune, selfHeal</text>
    <path d="M785 174 V196" stroke="#f0a36a" stroke-width="2"/>
    <path d="M780 254 V286" stroke="#3ddc97" stroke-width="2"/>
    <polygon points="774,286 780,298 786,286" fill="#3ddc97"/>

    <rect x="450" y="304" width="230" height="72" rx="8" fill="#145c45"/>
    <text x="565" y="330" text-anchor="middle" fill="#e8fff4">Web NodePort · NGINX</text>
    <text x="565" y="350" text-anchor="middle" fill="#b7f3d8" font-size="12">production.agribridge.deuces.dev</text>
    <text x="565" y="366" text-anchor="middle" fill="#b7f3d8" font-size="12">/ · /api/ · /healthz · /readyz · /version</text>

    <rect x="900" y="304" width="210" height="72" rx="8" fill="#1d4e89"/>
    <text x="1005" y="330" text-anchor="middle" fill="#fff">Grafana NodePort</text>
    <text x="1005" y="350" text-anchor="middle" fill="#d6e8ff" font-size="12">grafana.agribridge.deuces.dev</text>
    <text x="1005" y="366" text-anchor="middle" fill="#d6e8ff" font-size="12">same ALB · Secrets Manager</text>

    <path d="M680 340 H708" stroke="#3ddc97" stroke-width="2"/>
    <polygon points="708,334 720,340 708,346" fill="#3ddc97"/>
    <rect x="720" y="314" width="160" height="52" rx="8" fill="#145c45"/>
    <text x="800" y="345" text-anchor="middle" fill="#e8fff4">API</text>

    <rect x="450" y="400" width="160" height="44" rx="8" fill="#0f6b4c"/>
    <text x="530" y="427" text-anchor="middle" fill="#e8fff4">PostgreSQL</text>
    <rect x="630" y="400" width="140" height="44" rx="8" fill="#8d2a2a"/>
    <text x="700" y="427" text-anchor="middle" fill="#fff">Redis</text>
    <path d="M800 366 V422 H770" stroke="#3ddc97" stroke-width="2" fill="none"/>
    <path d="M800 422 H610 V444" stroke="#3ddc97" stroke-width="2" fill="none"/>

    <rect x="450" y="468" width="200" height="52" rx="8" fill="#12324c" stroke="#7eb6e6"/>
    <text x="550" y="490" text-anchor="middle" fill="#e7f3ff">Prometheus</text>
    <text x="550" y="508" text-anchor="middle" fill="#9eb6c9" font-size="12">cluster only · scrapes /metrics</text>
    <rect x="670" y="468" width="150" height="52" rx="8" fill="#12324c" stroke="#7eb6e6"/>
    <text x="745" y="490" text-anchor="middle" fill="#e7f3ff">Loki</text>
    <text x="745" y="508" text-anchor="middle" fill="#9eb6c9" font-size="12">Promtail ships logs</text>
    <rect x="840" y="468" width="270" height="52" rx="8" fill="#12324c" stroke="#7eb6e6"/>
    <text x="975" y="490" text-anchor="middle" fill="#e7f3ff">External Secrets</text>
    <text x="975" y="508" text-anchor="middle" fill="#9eb6c9" font-size="12">Secrets Manager agribridge/production</text>

    <rect x="450" y="544" width="320" height="52" rx="8" fill="#6b3f12"/>
    <text x="610" y="566" text-anchor="middle" fill="#fff">Postgres backup CronJob</text>
    <text x="610" y="584" text-anchor="middle" fill="#f3d7b0" font-size="12">02:15 UTC · pg_dump · 30-day expiry</text>
    <rect x="790" y="544" width="320" height="52" rx="8" fill="#c4551a"/>
    <text x="950" y="575" text-anchor="middle" fill="#fff">S3 backup bucket</text>

    <text x="450" y="628" fill="#9eb6c9" font-size="13">Terraform also owns the zone, the certificate, IAM and IRSA, GitHub variables,</text>
    <text x="450" y="648" fill="#9eb6c9" font-size="13">and the platform charts: Argo CD, external-dns, external-secrets, kube-prometheus-stack, Loki, Promtail.</text>
    <text x="450" y="668" fill="#9eb6c9" font-size="13">kOps installs the AWS Load Balancer Controller. Tracing (OpenTelemetry and Tempo) is later.</text>
    <text x="450" y="696" fill="#9eb6c9" font-size="13">App secrets stay in Secrets Manager. The Argo CD admin password stays in the cluster secret.</text>
  </g>
</svg>
