<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1250" viewBox="0 0 1600 1250" role="img" aria-labelledby="title desc">
<title id="title">AgriBridge system architecture</title>
<desc id="desc">GitHub Actions publishes Docker Hub images and GitOps release configuration. Argo CD deploys one Helm chart into separate staging and production namespaces in kOps Kubernetes on AWS. NLB and NGINX route browser traffic to the frontend and API. PostgreSQL uses persistent EBS storage, Redis provides caching, External Secrets delivers runtime secrets, and platform services collect metrics, logs and backups.</desc>
