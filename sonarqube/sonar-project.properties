sonar.projectKey=agribridge
sonar.projectName=AgriBridge
sonar.sourceEncoding=UTF-8

# Paths are relative to the repository root, for both local Docker and Actions.
sonar.sources=api/src,frontend/src,terraform,api/Dockerfile,frontend/Dockerfile,docker-compose.yml
sonar.tests=api/test,frontend/src
sonar.test.inclusions=api/test/**/*.js,frontend/src/**/*.test.js
sonar.exclusions=frontend/src/**/*.test.js,**/node_modules/**,**/.terraform/**,terraform/generated/**,**/*.tfstate*,**/*.tfplan

# Prepared from BOTH components' Vitest LCOV reports. No coverage exclusions:
# untested application code remains visible in the SonarQube dashboard.
sonar.javascript.lcov.reportPaths=.runtime/sonarqube/lcov.info

# A scan upload alone is not a passing gate. Wait and fail on a red gate/timeout.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
