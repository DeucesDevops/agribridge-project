name: agribridge-sonarqube

# Independent of the application Compose stack and all AWS infrastructure.
services:
  db:
    image: postgres:16.11-bookworm
    environment:
      POSTGRES_USER: sonar
      POSTGRES_DB: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD in sonarqube/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sonar -d sonar']
      interval: 5s
      timeout: 5s
      retries: 20

  sonarqube:
    image: sonarqube:26.10.0.133078-community
    depends_on:
      db: {condition: service_healthy}
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD in sonarqube/.env}
    ports:
      - '127.0.0.1:${SONAR_PORT:-9000}:9000'
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    ulimits:
      nofile: {soft: 131072, hard: 131072}
      nproc: 8192
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent http://localhost:9000/api/system/status | grep -q ''"status":"UP"''']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30

  scanner:
    image: sonarsource/sonar-scanner-cli:12.3.0.4285_8.1.0
    profiles: [scan]
    depends_on:
      sonarqube: {condition: service_healthy}
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    working_dir: /usr/src
    volumes:
      - ..:/usr/src:ro
    command:
      - -Dproject.settings=sonarqube/sonar-project.properties
      - -Dsonar.working.directory=/tmp/.scannerwork

volumes:
  postgres-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
