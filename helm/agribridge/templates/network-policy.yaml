{{- if .Values.releaseEnabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-data
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [{{ .Release.Name }}-postgres, {{ .Release.Name }}-redis]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}

{{- end }}
