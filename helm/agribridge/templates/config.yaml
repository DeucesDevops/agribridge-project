{{- if .Values.releaseEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Release.Name }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ .Release.Name }}
  target:
    name: {{ .Release.Name }}-runtime
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "secretArn is required" .Values.secretArn | quote }}
{{- end }}
