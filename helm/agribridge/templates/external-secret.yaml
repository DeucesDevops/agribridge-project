{{- if .Values.releaseEnabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Release.Name }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ .Release.Name }}
  target:
    name: {{ .Release.Name }}-runtime
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "secretArn is required" .Values.secretArn | quote }}

{{- end }}
