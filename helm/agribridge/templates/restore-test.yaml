{{- if .Values.restoreTest.enabled }}
{{- if not (hasPrefix (printf "%s/" .Values.backup.prefix) .Values.restoreTest.key) }}
{{- fail "Restore backup key must belong to the selected environment" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ required "restoreTest.jobName is required" .Values.restoreTest.jobName | quote }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-backup
      restartPolicy: Never
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: download
          image: amazon/aws-cli:2.32.0
          env:
            - {name: HOME, value: /tmp}
            - {name: AWS_DEFAULT_REGION, value: {{ .Values.region | quote }}}
          args:
            - s3
            - cp
            - {{ printf "s3://%s/%s" (required "backup.bucket is required" .Values.backup.bucket) (required "restoreTest.key is required" .Values.restoreTest.key) | quote }}
            - /backup/database.dump
            - --only-show-errors
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: backup, mountPath: /backup}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: verify
          image: {{ .Values.postgres.image }}
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: PGHOST, value: /tmp}
            - {name: PGUSER, value: agribridge}
            - {name: PGDATABASE, value: restore_check}
          command: [sh, -ec]
          args:
            - |
              initdb --username=agribridge --auth-local=trust --auth-host=scram-sha-256 >/dev/null
              pg_ctl -w start -o '-c listen_addresses=127.0.0.1 -k /tmp' >/dev/null
              trap 'pg_ctl -m fast -w stop >/dev/null' EXIT
              createdb restore_check
              pg_restore --exit-on-error --no-owner --no-acl --dbname=restore_check /backup/database.dump
              psql -v ON_ERROR_STOP=1 -c "SELECT 'users' AS entity, count(*) FROM users UNION ALL SELECT 'lots', count(*) FROM lots UNION ALL SELECT 'orders', count(*) FROM orders UNION ALL SELECT 'order_events', count(*) FROM order_events;"
              test "$(psql -At -c 'SELECT count(*) FROM schema_migrations')" -gt 0
              echo 'Backup restored successfully into isolated temporary storage.'
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: backup, mountPath: /backup, readOnly: true}
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: backup, emptyDir: {}}
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
{{- end }}
