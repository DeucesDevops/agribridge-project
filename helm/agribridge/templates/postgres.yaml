{{- if .Values.releaseEnabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  clusterIP: None
  selector: {app: {{ .Release.Name }}-postgres}
  ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-postgres
spec:
  serviceName: {{ .Release.Name }}-postgres
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}-postgres}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-postgres}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: POSTGRES_DB, value: agribridge}
            - {name: POSTGRES_USER, value: agribridge}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Release.Name }}-runtime, key: PGPASSWORD}
          ports: [{containerPort: 5432}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          readinessProbe:
            exec: {command: [pg_isready, -U, agribridge]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, agribridge]}
            initialDelaySeconds: 60
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storageClass }}
        resources:
          requests: {storage: {{ .Values.postgres.size }}}
{{- end }}
