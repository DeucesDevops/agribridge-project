{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-backup
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.backup.role | quote }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          serviceAccountName: {{ .Release.Name }}-backup
          restartPolicy: Never
          initContainers:
            - name: dump
              image: {{ .Values.postgres.image }}
              command: [sh, -ec, 'pg_dump --format=custom --file=/backup/database.dump']
              envFrom:
                - configMapRef: {name: {{ .Release.Name }}-config}
                - secretRef: {name: {{ .Release.Name }}-runtime}
              volumeMounts: [{name: backup, mountPath: /backup}]
          containers:
            - name: upload
              image: amazon/aws-cli:2.32.0
              command: [sh, -ec]
              args:
                - 'aws s3 cp /backup/database.dump "s3://{{ .Values.backup.bucket }}/{{ .Values.backup.prefix }}/$(date -u +%Y-%m-%dT%H-%M-%SZ).dump" --only-show-errors'
              volumeMounts: [{name: backup, mountPath: /backup}]
          volumes:
            - name: backup
              emptyDir: {}
{{- end }}
