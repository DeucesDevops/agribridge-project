# hostname must match terraform output production_hostname.
# The Argo CD Application also sets hostname, region, certificateArn,
# backup.bucket and backup.roleArn from Terraform. Those parameters win.
hostname: production.agribridge.deuces.dev
secretName: agribridge/production
# The production environment job writes the repositories and tags below
# after the images are on Docker Hub. `local` is only the placeholder until
# that first approved commit. Argo CD deploys whatever tag is committed here.
api:
  repository: docker.io/macroni607/agribridge-api
  tag: 35ed11f8325e10ab40f0e1fa4513cbbe72aeceac
  replicas: 2
web:
  repository: docker.io/macroni607/agribridge-web
  tag: 35ed11f8325e10ab40f0e1fa4513cbbe72aeceac
  replicas: 2
config:
  SEED_DEMO_DATA: "false"
backup:
  enabled: true
  prefix: production
