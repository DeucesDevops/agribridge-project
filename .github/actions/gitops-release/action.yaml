name: Select and verify a GitOps release
description: Commit validated digests, then wait for Argo CD and verify the expected release over HTTPS
inputs:
  environment:
    description: staging or production
    required: true
  tag:
    description: Exact commit/run/attempt tag that passed CI
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - name: Install release dependency
      shell: bash
      run: python -m pip install -r scripts/requirements.txt
    - name: Stage the published release
      if: inputs.environment == 'staging'
      shell: bash
      run: python scripts/release.py stage .runtime/release.json
    - name: Verify staging and select its exact digests for production
      if: inputs.environment == 'production'
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        python scripts/smoke-test.py staging "$RELEASE_TAG"
        python scripts/release.py promote --expected-tag "$RELEASE_TAG"
    - name: Commit the selected release
      shell: bash
      env:
        RELEASE_ENVIRONMENT: ${{ inputs.environment }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: python scripts/release.py commit "$RELEASE_ENVIRONMENT" --expected-tag "$RELEASE_TAG"
    - name: Wait for Argo CD and verify the public release
      shell: bash
      env:
        RELEASE_ENVIRONMENT: ${{ inputs.environment }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: python scripts/smoke-test.py "$RELEASE_ENVIRONMENT" "$RELEASE_TAG"
