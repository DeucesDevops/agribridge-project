name: Run a guarded infrastructure task
description: Shared, tested plan lifecycle used only by the manual infrastructure workflow
inputs:
  task:
    description: select, generate, platform-inputs, guard-destroy, plan, scan, bundle, restore, apply, verify-cluster, publish or cleanup
    required: true
outputs:
  directory:
    description: Terraform root selected by the stage
    value: ${{ steps.task.outputs.directory }}
  key:
    description: Terraform state key
    value: ${{ steps.task.outputs.key }}
  bundle:
    description: Private S3 plan bundle key
    value: ${{ steps.task.outputs.bundle }}
  checksum:
    description: SHA-256 of the exact saved plan bundle
    value: ${{ steps.task.outputs.checksum }}
  workspace:
    description: Absolute plan workspace required during apply
    value: ${{ steps.task.outputs.workspace }}
runs:
  using: composite
  steps:
    - id: task
      shell: bash
      env:
        INFRASTRUCTURE_TASK: ${{ inputs.task }}
      run: python3 .github/ci/infrastructure.py "$INFRASTRUCTURE_TASK"
