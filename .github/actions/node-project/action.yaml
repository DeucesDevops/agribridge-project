name: Prepare a Node project
description: Install the pinned Node runtime and the selected project's locked dependencies
inputs:
  directory:
    description: Application directory (api or frontend)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22.23.4'
        cache: npm
        cache-dependency-path: ${{ inputs.directory }}/package-lock.json
    - name: Install locked dependencies
      shell: bash
      working-directory: ${{ inputs.directory }}
      run: npm ci
