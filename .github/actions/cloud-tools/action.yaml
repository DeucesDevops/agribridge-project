name: Cloud tools and short-lived AWS authentication
description: Shared setup for manually dispatched infrastructure and operations jobs
inputs:
  role:
    description: AWS IAM role trusted for this GitHub environment
    required: true
  terraform:
    description: Install Terraform for infrastructure jobs only
    default: 'false'
  checkov:
    description: Install the pinned plan scanner for infrastructure planning only
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.13'
    - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      if: inputs.terraform == 'true'
      with:
        terraform_version: '1.14.6'
        terraform_wrapper: false
    - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      with:
        version: v3.19.0
    - name: Check runner prerequisites and protect private files
      shell: bash
      run: |
        set -euo pipefail
        for tool in aws kops kubectl; do command -v "$tool"; done
        test "$(kops version --short)" = '1.36.2'
        python3 -m pip install -r scripts/requirements.txt
        umask 077
        mkdir -p .runtime/automation
        chmod 700 .runtime/automation
        test -n "$AUTOMATION_ROLE" || { echo '::error::Configure the workflow AWS role variable'; exit 1; }
      env:
        AUTOMATION_ROLE: ${{ inputs.role }}
    - name: Install the infrastructure plan scanner
      if: inputs.checkov == 'true'
      shell: bash
      run: python3 -m pip install checkov==3.4.5
    - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
      with:
        role-to-assume: ${{ inputs.role }}
        aws-region: ${{ env.AWS_REGION }}
        allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}
        role-session-name: agribridge-${{ github.run_id }}
        unset-current-credentials: true
