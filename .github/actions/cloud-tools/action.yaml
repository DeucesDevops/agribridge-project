name: Cloud tools and short-lived AWS authentication
description: Shared setup for manually dispatched infrastructure and operations jobs
inputs:
  role:
    description: AWS IAM role trusted for this GitHub environment
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: '1.14.6'
        terraform_wrapper: false
    - uses: azure/setup-helm@v4.3.1
      with:
        version: v3.19.0
    - name: Check runner prerequisites and protect private files
      shell: bash
      run: |
        set -euo pipefail
        for tool in aws kops kubectl dig jq tar sha256sum; do command -v "$tool"; done
        test "$(kops version --short)" = '1.36.2'
        python3 -m pip install -r scripts/requirements.txt
        umask 077
        mkdir -p .runtime/automation
        chmod 700 .runtime/automation
        test -n "$AUTOMATION_ROLE" || { echo '::error::Configure the workflow AWS role variable'; exit 1; }
      env:
        AUTOMATION_ROLE: ${{ inputs.role }}
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role }}
        aws-region: ${{ env.AWS_REGION }}
        allowed-account-ids: ${{ env.EXPECTED_AWS_ACCOUNT_ID }}
        role-session-name: agribridge-${{ github.run_id }}
        unset-current-credentials: true
