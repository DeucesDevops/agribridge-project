name: Render application Kubernetes manifests
description: Render both environments, including backup, seed and restore jobs, for offline scanning
runs:
  using: composite
  steps:
    - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      with:
        version: v3.19.0
    - name: Render both environments with validation-only image digests
      shell: bash
      run: |
        mkdir -p .runtime/kubernetes
        for environment in staging production; do
          helm template agribridge helm/agribridge --namespace "agribridge-$environment" \
            -f "helm/agribridge/values-$environment.yaml" -f "argocd/$environment-values.yaml" \
            --set releaseEnabled=true --set restoreTest.enabled=true --set restoreTest.jobName=ci-restore-check \
            --set-string "restoreTest.key=$environment/ci-validation.dump" \
            --set-string api.digest=sha256:1111111111111111111111111111111111111111111111111111111111111111 \
            --set-string web.digest=sha256:2222222222222222222222222222222222222222222222222222222222222222 \
            > ".runtime/kubernetes/$environment.yaml"
        done
