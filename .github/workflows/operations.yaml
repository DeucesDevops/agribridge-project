name: Operations — checks, backups and restore tests
on:
  workflow_dispatch:
    inputs:
      task:
        description: Restore tests use isolated temporary storage
        type: choice
        options: [check, backup, restore-test, staging-resilience]
        default: check
      environment:
        description: Application environment
        type: choice
        options: [staging, production]
        default: staging
      backup_key:
        description: Required for restore-test, for example staging/2026-11-01T02-00-00Z.dump
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: agribridge-cloud-maintenance
  cancel-in-progress: false
env:
  AWS_REGION: us-east-1
  EXPECTED_AWS_ACCOUNT_ID: '237258628535'
  CLUSTER_NAME: k8s.agribridge.deuces.dev
  KOPS_STATE_STORE: s3://kops-state-607
jobs:
  maintenance:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, agribridge]
    environment: operations-${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 40
    env:
      TASK: ${{ inputs.task }}
      ENVIRONMENT: ${{ inputs.environment }}
      BACKUP_KEY: ${{ inputs.backup_key }}
      NAMESPACE: agribridge-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cloud-tools
        with:
          role: ${{ vars.AWS_OPERATIONS_ROLE }}
      - name: Validate task and establish a short-lived cluster session
        run: |
          set -euo pipefail
          test "$TASK" != staging-resilience || test "$ENVIRONMENT" = staging
          if [ "$TASK" = restore-test ]; then
            case "$BACKUP_KEY" in "$ENVIRONMENT/"*.dump) ;; *) echo '::error::Backup key must belong to the selected environment'; exit 2 ;; esac
          fi
          export KUBECONFIG="$GITHUB_WORKSPACE/.runtime/automation/kubeconfig"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          kops export kubeconfig "$CLUSTER_NAME" --admin=1h --kubeconfig "$KUBECONFIG"
          test "$(kubectl config current-context)" = "$CLUSTER_NAME"
          test "$(kubectl config view --minify -o 'jsonpath={.clusters[0].cluster.server}')" = "https://api.$CLUSTER_NAME"
      - name: Verify secrets delivery, workloads, storage and public release identity
        if: inputs.task == 'check'
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" wait --for=condition=Ready externalsecret/agribridge --timeout=300s
          kubectl -n "$NAMESPACE" rollout status statefulset/agribridge-postgres --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/agribridge-api --timeout=300s
          kubectl -n "$NAMESPACE" rollout status deployment/agribridge-web --timeout=300s
          kubectl -n "$NAMESPACE" get pvc
          tag=$(python3 -c 'import os,yaml; print(yaml.safe_load(open("argocd/"+os.environ["ENVIRONMENT"]+"-values.yaml"))["api"]["tag"])')
          python3 scripts/smoke-test.py "$ENVIRONMENT" "$tag" --runtime
      - name: Start a backup using the Helm-managed CronJob definition
        if: inputs.task == 'backup'
        run: |
          set -euo pipefail
          job="agribridge-backup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "OPERATION_JOB=$job" >> "$GITHUB_ENV"
          kubectl -n "$NAMESPACE" create job "$job" --from=cronjob/agribridge-backup
          kubectl -n "$NAMESPACE" wait --for=condition=complete "job/$job" --timeout=1800s
          kubectl -n "$NAMESPACE" logs "job/$job" -c upload
      - name: Create an isolated restore-verification Job from Helm
        if: inputs.task == 'restore-test'
        run: |
          set -euo pipefail
          job="agribridge-restore-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "OPERATION_JOB=$job" >> "$GITHUB_ENV"
          export RESTORE_JOB_NAME="$job"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('.runtime/automation/restore-values.json').write_text(json.dumps({
              'restoreTest': {'enabled': True, 'jobName': os.environ['RESTORE_JOB_NAME'],
                              'key': os.environ['BACKUP_KEY']}
          }))
          PY
          helm template agribridge helm/agribridge -n "$NAMESPACE" \
            -f "helm/agribridge/values-$ENVIRONMENT.yaml" -f "argocd/$ENVIRONMENT-values.yaml" \
            -f .runtime/automation/restore-values.json --show-only templates/restore-test.yaml \
            > .runtime/automation/restore-job.yaml
          kubectl -n "$NAMESPACE" create -f .runtime/automation/restore-job.yaml
          kubectl -n "$NAMESPACE" wait --for=condition=complete "job/$job" --timeout=1800s
          kubectl -n "$NAMESPACE" logs "job/$job" -c verify
      - name: Prove staging cache recovery and database persistence
        if: inputs.task == 'staging-resilience'
        run: python3 scripts/check-resilience.py
      - uses: actions/upload-artifact@v4
        if: always() && inputs.task == 'staging-resilience'
        with:
          name: staging-resilience
          path: .runtime/automation/resilience/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Show failed Job diagnostics
        if: failure() && env.OPERATION_JOB != ''
        run: |
          kubectl -n "$NAMESPACE" describe "job/$OPERATION_JOB"
          kubectl -n "$NAMESPACE" logs "job/$OPERATION_JOB" --all-containers=true --tail=100
      - name: Remove the temporary Job and private runner files
        if: always()
        run: |
          status=0
          if [ -n "${OPERATION_JOB:-}" ]; then
            kubectl -n "$NAMESPACE" delete job "$OPERATION_JOB" --ignore-not-found --wait=false || status=$?
          fi
          rm -rf .runtime/automation
          exit "$status"
