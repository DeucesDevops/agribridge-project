name: Operations — checks, backups and restore tests
on:
  workflow_dispatch:
    inputs:
      task:
        description: Restore tests use isolated temporary storage
        type: choice
        options: [check, backup, restore-test, staging-resilience]
        default: check
      environment:
        description: Application environment
        type: choice
        options: [staging, production]
        default: staging
      backup_key:
        description: Required for restore-test, for example staging/2026-11-01T02-00-00Z.dump
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: agribridge-cloud-maintenance
  cancel-in-progress: false
env:
  AWS_REGION: us-east-1
  EXPECTED_AWS_ACCOUNT_ID: '237258628535'
  CLUSTER_NAME: k8s.agribridge.deuces.dev
  KOPS_STATE_STORE: s3://kops-state-607
jobs:
  maintenance:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, agribridge]
    environment: operations-${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 40
    env:
      TASK: ${{ inputs.task }}
      ENVIRONMENT: ${{ inputs.environment }}
      BACKUP_KEY: ${{ inputs.backup_key }}
      NAMESPACE: agribridge-${{ inputs.environment }}
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare tools and the operations identity
        uses: ./.github/actions/cloud-tools
        with:
          role: ${{ vars.AWS_OPERATIONS_ROLE }}
      - name: Validate the selected task and environment
        uses: ./.github/actions/operations-task
        with:
          task: validate
      - name: Open a verified cluster session
        uses: ./.github/actions/cluster-session
      - name: Check workloads, storage and the running release
        if: inputs.task == 'check'
        uses: ./.github/actions/operations-task
        with:
          task: health
      - name: Run an on-demand database backup
        if: inputs.task == 'backup'
        uses: ./.github/actions/operations-task
        with:
          task: backup
      - name: Verify a backup in an isolated temporary database
        if: inputs.task == 'restore-test'
        uses: ./.github/actions/operations-task
        with:
          task: restore
      - name: Verify staging cache recovery and database persistence
        if: inputs.task == 'staging-resilience'
        uses: ./.github/actions/operations-task
        with:
          task: resilience
      - name: Save resilience evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && inputs.task == 'staging-resilience'
        with:
          name: staging-resilience
          path: .runtime/automation/resilience/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Show diagnostics for a failed operation
        if: failure() && env.OPERATION_JOB != ''
        uses: ./.github/actions/operations-task
        with:
          task: diagnostics
      - name: Remove the temporary Job and private session files
        if: always()
        uses: ./.github/actions/operations-task
        with:
          task: cleanup
