name: SonarQube analysis only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonarqube-main
  cancel-in-progress: false
jobs:
  analysis:
    # Community Build analyses the main branch only. No publishing or deployment.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Validate SonarQube connection settings
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_HOST_URL" || { echo '::error::Set the SONAR_HOST_URL repository variable'; exit 1; }
          test -n "$SONAR_TOKEN" || { echo '::error::Set the SONAR_TOKEN repository secret'; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix api && npm ci --prefix frontend
      - run: npm run test:coverage --prefix api && npm run test:coverage --prefix frontend
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python3 sonarqube/prepare-coverage.py
      - name: Analyse code and require a passing quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scannerVersion: 8.1.0.6389
          args: -Dproject.settings=sonarqube/sonar-project.properties
