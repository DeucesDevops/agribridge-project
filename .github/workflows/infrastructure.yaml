name: Infrastructure — plan, apply or destroy
on:
  workflow_dispatch:
    inputs:
      stage:
        description: Run in order bootstrap, cluster, services, platform; destroy in reverse
        type: choice
        options: [bootstrap, cluster, services, platform]
        default: services
      action:
        description: Apply and destroy wait for the infrastructure environment approval
        type: choice
        options: [plan, apply, destroy]
        default: plan
      confirmation:
        description: For destroy, enter k8s.agribridge.deuces.dev
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: agribridge-cloud-maintenance
  cancel-in-progress: false
env:
  AWS_REGION: us-east-1
  EXPECTED_AWS_ACCOUNT_ID: '237258628535'
  TF_VAR_expected_account_id: '237258628535'
  TF_VAR_discovery_bucket: agribridge-oidc-237258628535
  STATE_BUCKET: agribridge-tfstate-237258628535
  CLUSTER_NAME: k8s.agribridge.deuces.dev
  KOPS_STATE_STORE: s3://kops-state-607
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
jobs:
  plan:
    name: Prepare, scan and save the infrastructure plan
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, agribridge]
    environment: infrastructure-plan
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 45
    outputs:
      bundle: ${{ steps.bundle.outputs.bundle }}
      checksum: ${{ steps.bundle.outputs.checksum }}
      workspace: ${{ steps.bundle.outputs.workspace }}
    env:
      STAGE: ${{ inputs.stage }}
      ACTION: ${{ inputs.action }}
      CONFIRMATION: ${{ inputs.confirmation }}
      AGRIBRIDGE_API_CIDRS: ${{ vars.KUBERNETES_API_CIDRS }}
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare tools and the planning identity
        uses: ./.github/actions/cloud-tools
        with:
          role: ${{ vars.AWS_INFRA_PLAN_ROLE }}
          terraform: 'true'
          checkov: 'true'
      - name: Validate the request and recover the existing state boundary
        uses: ./.github/actions/infrastructure-task
        with:
          task: select
      - name: Generate the pinned kOps Terraform configuration
        if: inputs.stage == 'cluster'
        uses: ./.github/actions/infrastructure-task
        with:
          task: generate
      - name: Open a verified session to the existing cluster
        if: inputs.stage == 'platform'
        uses: ./.github/actions/cluster-session
      - name: Resolve platform inputs from current service outputs
        if: inputs.stage == 'platform'
        uses: ./.github/actions/infrastructure-task
        with:
          task: platform-inputs
      - name: Enforce safe teardown order
        if: inputs.action == 'destroy'
        uses: ./.github/actions/infrastructure-task
        with:
          task: guard-destroy
      - name: Validate and save the exact Terraform plan
        id: saved-plan
        uses: ./.github/actions/infrastructure-task
        with:
          task: plan
      - name: Check the resolved plan against the security policy
        uses: ./.github/actions/infrastructure-task
        with:
          task: scan
      - name: Store the private plan and scan evidence for review
        id: bundle
        if: always() && steps.saved-plan.outcome == 'success'
        uses: ./.github/actions/infrastructure-task
        with:
          task: bundle
      - name: Remove private runner files
        if: always()
        uses: ./.github/actions/infrastructure-task
        with:
          task: cleanup

  apply:
    name: Apply the approved saved plan and verify the result
    if: inputs.action != 'plan'
    needs: plan
    runs-on: [self-hosted, linux, x64, agribridge]
    environment: infrastructure
    permissions:
      contents: write
      id-token: write
    timeout-minutes: 60
    env:
      STAGE: ${{ inputs.stage }}
      ACTION: ${{ inputs.action }}
      CONFIRMATION: ${{ inputs.confirmation }}
      PLAN_KEY: ${{ needs.plan.outputs.bundle }}
      PLAN_CHECKSUM: ${{ needs.plan.outputs.checksum }}
      PLAN_WORKSPACE: ${{ needs.plan.outputs.workspace }}
    steps:
      - name: Check out the source used to create the plan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare tools and the approved apply identity
        uses: ./.github/actions/cloud-tools
        with:
          role: ${{ vars.AWS_INFRA_APPLY_ROLE }}
          terraform: 'true'
      - name: Restore and verify the reviewed plan bundle
        uses: ./.github/actions/infrastructure-task
        with:
          task: restore
      - name: Open a fresh verified cluster session
        if: inputs.stage == 'platform'
        uses: ./.github/actions/cluster-session
      - name: Apply the saved plan without replanning
        uses: ./.github/actions/infrastructure-task
        with:
          task: apply
      - name: Open a session to the newly provisioned cluster
        if: inputs.stage == 'cluster' && inputs.action == 'apply'
        uses: ./.github/actions/cluster-session
      - name: Verify cluster controllers and admission endpoints
        if: inputs.stage == 'cluster' && inputs.action == 'apply'
        uses: ./.github/actions/infrastructure-task
        with:
          task: verify-cluster
      - name: Publish non-secret runtime references to GitOps
        if: inputs.stage == 'services' && inputs.action == 'apply'
        uses: ./.github/actions/infrastructure-task
        with:
          task: publish
      - name: Remove private runner files
        if: always()
        uses: ./.github/actions/infrastructure-task
        with:
          task: cleanup
