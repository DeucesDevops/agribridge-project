name: AgriBridge DevSecOps Pipeline

on:
  push:
    branches: [dev, main]
    paths-ignore:
      - 'argocd/*-values.yaml'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      analysis_only:
        description: Run checks and require SonarQube on main, without publishing or deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gitleaks-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'

  checkov:
    name: Checkov (${{ matrix.framework }})
    needs: gitleaks-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: terraform
            directory: terraform
          - framework: kubernetes
            directory: .runtime/kubernetes
          - framework: dockerfile
            directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Render the actual Helm workloads for scanning
        if: matrix.framework == 'kubernetes'
        uses: ./.github/actions/render-manifests
      - name: Enforce the documented infrastructure security policy
        uses: bridgecrewio/checkov-action@3f0caf0c3aa9f56ade6b49f6e60b63aaeafb75a3 # v12, Checkov 3.4.5
        with:
          directory: ${{ matrix.directory }}
          framework: ${{ matrix.framework }}
          config_file: .github/checkov.yaml
          soft_fail: false
          skip_download: true
          output_format: cli,json
          output_file_path: console,checkov-${{ matrix.framework }}.json
      - name: Reject empty or partially parsed scans
        run: python3 .github/ci/verify-checkov.py "checkov-${{ matrix.framework }}.json"
      - name: Upload scan evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkov-${{ matrix.framework }}
          path: checkov-${{ matrix.framework }}.json
          if-no-files-found: error

  trivy-fs:
    name: Trivy source scan (${{ matrix.component }})
    needs: gitleaks-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        component: [api, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Block fixable high and critical dependency vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: ${{ matrix.component }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: trivy-source-${{ matrix.component }}.json
      - name: Upload source vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-source-${{ matrix.component }}
          path: trivy-source-${{ matrix.component }}.json
          if-no-files-found: error
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0, Syft 1.42.3
        with:
          path: ${{ matrix.component }}
          format: spdx-json
          artifact-name: ${{ matrix.component }}-source-sbom
          upload-release-assets: false

  lint:
    name: Lint and npm audit (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        component: [api, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-project
        with:
          directory: ${{ matrix.component }}
      - name: Lint with no warnings
        run: npm run lint -- --max-warnings=0
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high

  test:
    name: Unit tests and coverage (${{ matrix.component }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        component: [api, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-project
        with:
          directory: ${{ matrix.component }}
      - name: Run tests and produce coverage and JUnit reports
        working-directory: ${{ matrix.component }}
        run: npm run test:coverage -- --reporter=default --reporter=junit --outputFile=reports/unit.xml
      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.component }}
          path: |
            ${{ matrix.component }}/reports/
            ${{ matrix.component }}/coverage/
          if-no-files-found: error

  integration-test:
    name: API integration tests (real PostgreSQL)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.11-bookworm
        env:
          POSTGRES_USER: agribridge
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: agribridge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agribridge"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: agribridge
      PGPASSWORD: integration-only
      PGDATABASE: agribridge_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-project
        with:
          directory: api
      - name: Exercise database migrations and integration behaviour
        run: npm run test:integration --prefix api
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-results
          path: api/reports/
          if-no-files-found: error

  sonarqube:
    name: SonarQube analysis and quality gate
    needs: [test, integration-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      RUN_SONAR: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (vars.SONAR_ENABLED == 'true' || inputs.analysis_only) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject analysis-only requests on unsupported branches
        if: inputs.analysis_only && github.ref != 'refs/heads/main'
        run: echo '::error::Community Build analysis_only requires main'; exit 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.RUN_SONAR == 'true'
        with:
          name: test-results-api
          path: api
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.RUN_SONAR == 'true'
        with:
          name: test-results-frontend
          path: frontend
      - name: Validate settings and combine API/frontend coverage
        if: env.RUN_SONAR == 'true'
        run: |
          test -n "$SONAR_HOST_URL" || { echo '::error::Set the SONAR_HOST_URL variable'; exit 1; }
          test -n "$SONAR_TOKEN" || { echo '::error::Set the SONAR_TOKEN secret'; exit 1; }
          python3 sonarqube/prepare-coverage.py
      - name: Analyze and wait for a passing quality gate
        if: env.RUN_SONAR == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          scannerVersion: 8.1.0.6389
          args: -Dproject.settings=sonarqube/sonar-project.properties
      - name: Explain when SonarQube is not running
        if: env.RUN_SONAR != 'true'
        run: echo 'SonarQube was not run. Community Build scans main only; enable SONAR_ENABLED with a reachable SONAR_HOST_URL and SONAR_TOKEN. This is not a passing scan.' >> "$GITHUB_STEP_SUMMARY"

  client-build:
    name: Frontend production build
    needs: [test, sonarqube]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-project
        with:
          directory: frontend
      - name: Build and enforce the bundle budget
        run: npm run build --prefix frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-build
          path: frontend/dist/
          if-no-files-found: error

  platform:
    name: Helm, release safety and workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation dependency
        run: python -m pip install -r scripts/requirements.txt
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.19.0
      - name: Lint the application chart
        run: helm lint helm/agribridge --set secretArn=validation
      - name: Verify promotion, GitOps, CI guards and Helm rendering
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Verify coverage preparation
        run: python -m unittest discover -s sonarqube -p 'test_*.py' -v
      - name: Verify the NGINX and AWS NLB service contract
        run: python .github/ci/verify-ingress.py
      - name: Lint workflows and their shell commands
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Validate the local verification script
        run: bash -n scripts/verify-local.sh

  terraform:
    name: Terraform validation (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        directory: [terraform/bootstrap, terraform/cluster, terraform, terraform/platform]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.6'
      - name: Check formatting
        run: terraform fmt -check -recursive terraform
      - name: Validate without cloud credentials or a remote backend
        env:
          TF_DIRECTORY: ${{ matrix.directory }}
        run: |
          if [ "$TF_DIRECTORY" = terraform/cluster ] && [ ! -f terraform/generated/kops/kubernetes.tf ]; then
            echo '::notice::Generated kOps Terraform is validated during infrastructure provisioning.'
          else
            terraform -chdir="$TF_DIRECTORY" init -backend=false -input=false
            terraform -chdir="$TF_DIRECTORY" validate -no-color
          fi

  validation:
    name: Require all source and configuration checks
    if: always()
    needs: [gitleaks-scan, checkov, trivy-fs, lint, test, integration-test, sonarqube, client-build, platform, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
          SKIPPED: ${{ contains(needs.*.result, 'skipped') }}
        run: test "$FAILED" = false && test "$CANCELLED" = false && test "$SKIPPED" = false

  publish:
    name: Docker build, runtime verification, scan and SBOM
    if: ${{ !inputs.analysis_only }}
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.identity.outputs.tag }}
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'macroni607' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install release dependency
        run: python -m pip install -r scripts/requirements.txt
      - name: Resolve one immutable build identity
        id: identity
        run: python scripts/release.py identity
      - name: Prepare the disposable local environment
        run: cp .env.example .env
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build API and web once using the Compose build definition
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        with:
          source: .
          files: docker-compose.yml
          targets: api,web
          load: true
          push: false
      - name: Start the exact built images with PostgreSQL and Redis
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Verify readiness, build identity and same-origin authentication
        run: node .github/ci/verify-images.mjs
      - name: Gate the API image on fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.69.3
          image-ref: ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: trivy-image-api.json
      - name: Gate the web image on fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.69.3
          image-ref: ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: json
          output: trivy-image-web.json
      - name: Generate API image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0, Syft 1.42.3
        with:
          image: ${{ env.API_IMAGE }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          artifact-name: api-image-sbom
          upload-release-assets: false
      - name: Generate web image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0, Syft 1.42.3
        with:
          image: ${{ env.WEB_IMAGE }}:${{ env.IMAGE_TAG }}
          format: spdx-json
          artifact-name: web-image-sbom
          upload-release-assets: false
      - name: Log in only after all image gates pass
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the exact tested API image without rebuilding
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker push "$API_IMAGE:$IMAGE_TAG"
      - name: Push the exact tested web image without rebuilding
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker push "$WEB_IMAGE:$IMAGE_TAG"
      - name: Record the published registry digests
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: python scripts/release.py record .runtime/release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: published-release
          path: .runtime/release.json
          if-no-files-found: error
      - name: Upload image scan evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-images
          path: trivy-image-*.json
          if-no-files-found: warn
      - name: Explain offline deployment mode
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED != 'true'
        run: echo 'Images published. Staging and production deployment are disabled; set DEPLOY_ENABLED=true only when the existing platform is running.' >> "$GITHUB_STEP_SUMMARY"
      - name: Show Compose diagnostics
        if: failure()
        run: docker compose logs --tail=100
      - name: Remove the disposable local stack
        if: always()
        run: docker compose down -v

  # This remains the stable branch-protection check, including container gates.
  checks:
    name: checks
    if: always()
    needs: [validation, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require source, configuration and container gates
        env:
          VALIDATION: ${{ needs.validation.result }}
          CONTAINERS: ${{ needs.publish.result }}
          ANALYSIS_ONLY: ${{ inputs.analysis_only }}
        run: |
          test "$VALIDATION" = success
          if [ "$ANALYSIS_ONLY" = true ]; then
            test "$CONTAINERS" = skipped
          else
            test "$CONTAINERS" = success
          fi

  staging:
    name: Update staging GitOps values and verify Argo CD deployment
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.analysis_only && vars.DEPLOY_ENABLED == 'true'
    needs: [publish, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.agribridge.deuces.dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: published-release
          path: .runtime
      - uses: ./.github/actions/gitops-release
        with:
          environment: staging
          tag: ${{ needs.publish.outputs.image_tag }}

  production:
    name: Promote the verified staging digests and verify production
    needs: [publish, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://production.agribridge.deuces.dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/gitops-release
        with:
          environment: production
          tag: ${{ needs.publish.outputs.image_tag }}
