name: Verify, publish and release through GitOps
on:
  push:
    branches: [main]
    paths-ignore:
      - 'argocd/*-values.yaml'
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:
    inputs:
      analysis_only:
        description: Run checks and SonarQube without publishing or deploying
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.11-bookworm
        env:
          POSTGRES_USER: agribridge
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: agribridge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agribridge"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: agribridge
      PGPASSWORD: integration-only
      PGDATABASE: agribridge_test
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix api && npm ci --prefix frontend
      - run: npm run lint --prefix api -- --max-warnings=0 && npm run lint --prefix frontend -- --max-warnings=0
      - run: npm audit --prefix api --audit-level=high && npm audit --prefix frontend --audit-level=high
      - run: npm run test:coverage --prefix api
      - run: cp api/reports/junit.xml api/reports/unit.xml
      - run: npm run test:integration --prefix api
      - run: npm run test:coverage --prefix frontend
      - run: npm run build --prefix frontend
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Validate coverage-path preparation
        run: python3 -m unittest discover -s sonarqube -p 'test_*.py'
      - name: Prepare SonarQube configuration and coverage
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (vars.SONAR_ENABLED == 'true' || inputs.analysis_only)
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_HOST_URL" || { echo '::error::Set the SONAR_HOST_URL repository variable before enabling SonarQube'; exit 1; }
          test -n "$SONAR_TOKEN" || { echo '::error::Set the SONAR_TOKEN repository secret before enabling SonarQube'; exit 1; }
          python3 sonarqube/prepare-coverage.py
      - name: SonarQube analysis and quality gate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (vars.SONAR_ENABLED == 'true' || inputs.analysis_only)
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scannerVersion: 8.1.0.6389
          args: -Dproject.settings=sonarqube/sonar-project.properties
      - name: Report disabled SonarQube integration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SONAR_ENABLED != 'true' && !inputs.analysis_only
        run: echo 'SonarQube is disabled. Configure a reachable server, SONAR_HOST_URL, SONAR_TOKEN and SONAR_ENABLED=true to enforce its quality gate.' >> "$GITHUB_STEP_SUMMARY"
      - run: python -m pip install -r scripts/requirements.txt
      - uses: azure/setup-helm@v4.3.1
        with: {version: v3.19.0}
      - run: helm lint helm/agribridge --set secretArn=validation
      - name: Validate release promotion, Argo CD and application renders
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Validate NGINX controller and NLB service rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          values = Path('kubedefs/nginx-ingress-values.yaml.tftpl').read_text()
          values = values.replace('${certificate_arn}', 'arn:aws:acm:us-east-1:123456789012:certificate/validation')
          Path('/tmp/nginx-values.yaml').write_text(values)
          PY
          helm template nginx-ingress oci://ghcr.io/nginx/charts/nginx-ingress --version 2.8.0 \
            --namespace ingress --kube-version 1.36.6 --skip-crds --values /tmp/nginx-values.yaml > /tmp/nginx-rendered.yaml
          ruby -ryaml -e '
            service = YAML.load_stream(File.read("/tmp/nginx-rendered.yaml")).compact.find { |r| r["kind"] == "Service" && r.dig("metadata", "name") == "nginx-ingress-controller" }
            abort "NGINX LoadBalancer service missing" unless service && service.dig("spec", "type") == "LoadBalancer"
            ports = service.dig("spec", "ports")
            abort "Expected only TLS 443 to backend HTTP 80" unless ports.length == 1 && ports[0]["port"] == 443 && ports[0]["targetPort"] == 80
            abort "Wrong controller class" unless service.dig("spec", "loadBalancerClass") == "service.k8s.aws/nlb"
          '
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: Validate deployment scripts
        run: for script in scripts/*.sh; do bash -n "$script" || exit; done
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: '1.14.6'}
      - run: terraform fmt -check -recursive terraform
      - name: Validate Terraform modules without cloud credentials
        run: |
          for directory in terraform/bootstrap terraform/cluster terraform terraform/platform; do
            if [ "$directory" = terraform/cluster ] && [ ! -f terraform/generated/kops/kubernetes.tf ]; then
              echo "::notice::Cluster validation deferred until kOps code is regenerated during infrastructure provisioning."
              continue
            fi
            terraform -chdir="$directory" init -backend=false -input=false
            terraform -chdir="$directory" validate -no-color
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            api/reports/
            api/coverage/
            frontend/coverage/
      - name: Summarize JUnit results
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('### API test reports\n\n')
              for path in (Path('api/reports/unit.xml'), Path('api/reports/junit.xml')):
                  if path.exists():
                      root = ET.parse(path).getroot()
                      suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
                      tests = sum(int(s.get('tests', 0)) for s in suites)
                      failures = sum(int(s.get('failures', 0)) + int(s.get('errors', 0)) for s in suites)
                      output.write(f'- {path.name}: {tests} tests, {failures} failures/errors\n')
          PY
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.analysis_only
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r scripts/requirements.txt
      - name: Log in to your Docker Hub account
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'macroni607' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Resolve deployment and build identity
        id: identity
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'macroni607' }}
        run: |
          python - <<'PY'
          import os, re, yaml
          from pathlib import Path
          values = yaml.safe_load(Path('argocd/staging-values.yaml').read_text())
          for component in ('api', 'web'):
              assert re.fullmatch(r'docker\.io/[a-z0-9_-]+/agribridge-' + component, values[component]['repository'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('API_IMAGE=' + values['api']['repository'] + '\n')
              output.write('WEB_IMAGE=' + values['web']['repository'] + '\n')
          PY
          tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "GIT_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(node -p 'require("./api/package.json").version')" >> "$GITHUB_ENV"
      - name: Build and exercise the exact images to publish
        run: |
          cp .env.example .env
          docker compose build
          docker compose up -d --wait --wait-timeout 180
          curl --fail http://localhost:8080/ -o /dev/null
          docker compose exec -T api node -e "fetch('http://localhost:3000/readyz').then(r=>{if(!r.ok)process.exit(1)})"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const origin = 'http://localhost:8080';
          assert.equal((await fetch(origin + '/readyz')).status, 200);
          const version = await (await fetch(origin + '/version')).json();
          assert.equal(version.imageTag, process.env.IMAGE_TAG);
          assert.equal(version.gitSha, process.env.GIT_SHA);
          const login = await fetch(origin + '/api/auth/login', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email: 'amina.yusuf@example.ng', password: 'local-demo-password-only'}),
          });
          assert.equal(login.status, 200);
          const cookie = login.headers.get('set-cookie');
          assert.ok(cookie?.includes('HttpOnly'));
          assert.equal((await fetch(origin + '/api/auth/me', {
            headers: {Cookie: cookie.split(';')[0]},
          })).status, 200);
          console.log('Exact images passed same-origin authentication and build identity.');
          JS
      - name: Gate image publication on fixable high and critical vulnerabilities
        run: |
          for image in "$API_IMAGE:$IMAGE_TAG" "$WEB_IMAGE:$IMAGE_TAG"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-cache:/root/.cache/ aquasec/trivy:0.69.3 image \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Publish verified images
        run: |
          docker push "$API_IMAGE:$IMAGE_TAG"
          docker push "$WEB_IMAGE:$IMAGE_TAG"
          python scripts/release.py record .runtime/release.json
      - uses: actions/upload-artifact@v4
        with:
          name: published-release
          path: .runtime/release.json
          if-no-files-found: error
      - name: Compose diagnostics
        if: failure()
        run: if [ -f .env ]; then docker compose logs --tail=100; fi
      - name: Clean local stack
        if: always()
        run: if [ -f .env ]; then docker compose down -v; fi
  staging:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.agribridge.deuces.dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r scripts/requirements.txt
      - uses: actions/download-artifact@v4
        with: {name: published-release, path: .runtime}
      - name: Record the verified staging release in Git
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.image_tag }}
        run: |
          python scripts/release.py stage .runtime/release.json
          python scripts/release.py commit staging --expected-tag "$RELEASE_TAG"
      - name: Wait for Argo CD and verify staging over HTTPS
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.image_tag }}
        run: python scripts/smoke-test.py staging "$RELEASE_TAG"
  production:
    needs: [publish, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://production.agribridge.deuces.dev
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r scripts/requirements.txt
      - name: Promote the exact staging image digests in Git
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.image_tag }}
        run: |
          python scripts/smoke-test.py staging "$RELEASE_TAG"
          python scripts/release.py promote --expected-tag "$RELEASE_TAG"
          python scripts/release.py commit production --expected-tag "$RELEASE_TAG"
      - name: Wait for Argo CD and verify production over HTTPS
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.image_tag }}
        run: python scripts/smoke-test.py production "$RELEASE_TAG"
