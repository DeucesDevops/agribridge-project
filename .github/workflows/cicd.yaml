# AgriBridge CI/CD
#
# Read this file from top to bottom:
#   lint and test -> Gitleaks -> SonarQube -> Trivy source scan -> Checkov
#   -> build images -> Trivy image scan -> SBOM -> push to Docker Hub
#   -> manual approval -> commit the image tag on main
#
# SonarQube is skipped when SONAR_TOKEN or SONAR_HOST_URL is unset.
# Push runs on main when the Docker Hub secrets are set.
# Production waits on the GitHub environment named "production".
# After approval, the job commits the image tag to helm/agribridge/values-production.yaml.
# The commit message contains [skip ci], and the author is DeucesDevops.
# Argo CD tracks main and syncs that commit. The job does not run helm upgrade.

name: CI/CD

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  API_IMAGE_REPOSITORY: ${{ vars.API_IMAGE_REPOSITORY || 'docker.io/macroni607/agribridge-api' }}
  WEB_IMAGE_REPOSITORY: ${{ vars.WEB_IMAGE_REPOSITORY || 'docker.io/macroni607/agribridge-web' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    services:
      postgres:
        image: postgres:16.11-bookworm
        env:
          POSTGRES_USER: agribridge
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: agribridge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agribridge"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: agribridge
      PGPASSWORD: integration-only
      PGDATABASE: agribridge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix api
          npm ci --prefix frontend
      - name: Lint
        run: |
          npm run lint --prefix api -- --max-warnings=0
          npm run lint --prefix frontend -- --max-warnings=0
      - name: Unit tests and coverage
        run: |
          JUNIT_FILE=reports/junit-unit.xml npm run test:coverage --prefix api
          JUNIT_FILE=reports/junit.xml npm run test:coverage --prefix frontend
      - name: API integration tests
        run: JUNIT_FILE=reports/junit-integration.xml npm run test:integration --prefix api
      - name: Summarise test results
        if: always()
        run: python3 scripts/junit_summary.py api/reports frontend/reports >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: API and web tests
          path: |
            api/reports/junit-*.xml
            frontend/reports/junit.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: |
            api/reports/junit-*.xml
            frontend/reports/junit.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: api/coverage/lcov.info
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info
          if-no-files-found: error

  gitleaks:
    name: Gitleaks
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz
          ./gitleaks detect --source . --redact --verbose

  sonarqube:
    name: SonarQube
    needs: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip unless SonarQube is configured on main
        id: gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          if [ -z "${SONAR_TOKEN}" ] || [ -z "${SONAR_HOST_URL}" ]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "SonarQube skipped. Set the SONAR_TOKEN secret and the SONAR_HOST_URL variable to enable it."
            exit 0
          fi
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "SonarQube is configured. Analysis runs on main so the Community Build quality gate stays on one branch."
            exit 0
          fi
          echo "enabled=true" >> "${GITHUB_OUTPUT}"
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: coverage-api
          path: api/coverage
      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: coverage-frontend
          path: frontend/coverage
      - name: Combine coverage
        if: steps.gate.outputs.enabled == 'true'
        run: python3 sonarqube/prepare-coverage.py
      - name: Analyze and wait for the quality gate
        if: steps.gate.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v5.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: -Dproject.settings=sonarqube/sonar-project.properties

  trivy-fs:
    name: Trivy filesystem scan
    needs: sonarqube
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scan the API source
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: api
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
      - name: Scan the web source
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: frontend
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  checkov:
    name: Checkov and configuration
    needs: trivy-fs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Terraform format, init and validate
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=terraform validate -no-color
      - name: Helm lint and render
        run: |
          helm lint helm/agribridge
          helm lint helm/agribridge-application
          helm template agribridge helm/agribridge --namespace agribridge-production -f helm/agribridge/values-production.yaml > production.yaml
          helm template agribridge-application helm/agribridge-application --namespace argocd \
            --set-string certificateArn=arn:aws:acm:us-east-1:237258628535:certificate/00000000-0000-0000-0000-000000000000 \
            --set-string backupBucket=agribridge-backups-237258628535 \
            --set-string backupRoleArn=arn:aws:iam::237258628535:role/agribridge-backup-production \
            > application.yaml
          grep -q 'prune: true' application.yaml
          grep -q 'selfHeal: true' application.yaml
          grep -q 'targetRevision: "main"' application.yaml
          argocd_version="$(sed -n 's/^[[:space:]]*argocd[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' terraform/modules/platform/main.tf)"
          test -n "${argocd_version}"
          helm repo add argo https://argoproj.github.io/argo-helm
          helm template argocd argo/argo-cd \
            --version "${argocd_version}" \
            --namespace argocd \
            --values platform/argocd-values.yaml \
            --values - > argocd.yaml <<'EOF'
          global:
            domain: argocd.agribridge.deuces.dev
          configs:
            cm:
              url: https://argocd.agribridge.deuces.dev
          server:
            ingress:
              annotations:
                alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:237258628535:certificate/00000000-0000-0000-0000-000000000000
                alb.ingress.kubernetes.io/target-type: instance
                external-dns.alpha.kubernetes.io/hostname: argocd.agribridge.deuces.dev
          EOF
          grep -q 'target-type: "instance"' argocd.yaml
          grep -q 'argocd.agribridge.deuces.dev' argocd.yaml
          grep -q 'server.insecure: "true"' argocd.yaml
      - name: Install Checkov
        run: |
          python3 -m venv "${RUNNER_TEMP}/checkov"
          "${RUNNER_TEMP}/checkov/bin/pip" install 'checkov==3.2.449'
          echo "${RUNNER_TEMP}/checkov/bin" >> "${GITHUB_PATH}"
      - name: Scan Terraform, the chart and the Dockerfiles
        run: |
          checkov --directory terraform --framework terraform --config-file .github/checkov.yaml --download-external-modules false
          checkov --file production.yaml --framework kubernetes --config-file .github/checkov.yaml
          checkov --file application.yaml --framework kubernetes --config-file .github/checkov.yaml
          checkov --directory api --framework dockerfile --config-file .github/checkov.yaml
          checkov --directory frontend --framework dockerfile --config-file .github/checkov.yaml

  build:
    name: Build, scan, SBOM and push
    needs: checkov
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pushed: ${{ steps.publish.outputs.pushed }}
      api_image: ${{ steps.publish.outputs.api_image }}
      web_image: ${{ steps.publish.outputs.web_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the API and web images
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for name in api web; do
            context="api"
            if [ "${name}" = "web" ]; then
              context="frontend"
            fi
            docker build \
              --build-arg "APP_VERSION=${IMAGE_TAG}" \
              --build-arg "GIT_SHA=${IMAGE_TAG}" \
              --build-arg "BUILD_DATE=${built}" \
              --build-arg "IMAGE_TAG=${IMAGE_TAG}" \
              -t "agribridge-${name}:${IMAGE_TAG}" \
              "${context}"
          done
      - name: Trivy scan the API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agribridge-api:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Trivy scan the web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agribridge-web:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: SBOM for the API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agribridge-api:${{ env.IMAGE_TAG }}
          format: cyclonedx
          output: api-sbom.cdx.json
          exit-code: "0"
      - name: SBOM for the web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agribridge-web:${{ env.IMAGE_TAG }}
          format: cyclonedx
          output: web-sbom.cdx.json
          exit-code: "0"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "*-sbom.cdx.json"
          if-no-files-found: error
      - name: Push images to Docker Hub
        id: publish
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          {
            echo "pushed=false"
            echo "api_image="
            echo "web_image="
          } >> "${GITHUB_OUTPUT}"
          if [ "${GITHUB_REF}" != "refs/heads/main" ] || [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "Images were scanned and were not pushed."
            exit 0
          fi
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "DOCKERHUB_USERNAME or DOCKERHUB_TOKEN is not set. Images were scanned. Push and deploy stay off until both secrets are set."
            exit 0
          fi
          echo "${DOCKERHUB_TOKEN}" | docker login --username "${DOCKERHUB_USERNAME}" --password-stdin
          docker tag "agribridge-api:${IMAGE_TAG}" "${API_IMAGE_REPOSITORY}:${IMAGE_TAG}"
          docker tag "agribridge-web:${IMAGE_TAG}" "${WEB_IMAGE_REPOSITORY}:${IMAGE_TAG}"
          docker push "${API_IMAGE_REPOSITORY}:${IMAGE_TAG}"
          docker push "${WEB_IMAGE_REPOSITORY}:${IMAGE_TAG}"
          {
            echo "pushed=true"
            echo "api_image=${API_IMAGE_REPOSITORY}"
            echo "web_image=${WEB_IMAGE_REPOSITORY}"
          } >> "${GITHUB_OUTPUT}"
          echo "Images are on Docker Hub. The production environment approval commits this tag for Argo CD."

  deploy-production:
    name: Publish production image tags
    needs: build
    if: needs.build.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Commit the approved image tag
        run: |
          # Author and committer are the repository owner. [skip ci] stops this
          # commit from building the same images again.
          git config user.name "DeucesDevops"
          git config user.email "macroni607@gmail.com"
          values="helm/agribridge/values-production.yaml"
          for _ in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            current="$(python3 -c 'import pathlib,re; text=pathlib.Path("'"${values}"'").read_text(); match=re.search(r"(?m)^  tag: (\S+)", text); print(match.group(1) if match else "")')"
            if [ "${current}" = "${IMAGE_TAG}" ]; then
              echo "Production already records ${IMAGE_TAG}."
              exit 0
            fi
            if git cat-file -e "${current}^{commit}" 2>/dev/null && git merge-base --is-ancestor "${IMAGE_TAG}" "${current}"; then
              echo "Production already records ${current}, which contains ${IMAGE_TAG}. Leaving it."
              exit 0
            fi
            python3 scripts/update_production_images.py \
              --file "${values}" \
              --api-repository "${API_IMAGE_REPOSITORY}" \
              --web-repository "${WEB_IMAGE_REPOSITORY}" \
              --tag "${IMAGE_TAG}"
            git add "${values}"
            if git diff --cached --quiet; then
              echo "Production values already match ${IMAGE_TAG}."
              exit 0
            fi
            git commit -m "deploy: set production images to ${IMAGE_TAG} [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected. Retrying against the new main."
            git reset --hard origin/main
          done
          echo "Could not push the production image tag."
          exit 1
