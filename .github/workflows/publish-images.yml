name: Publish Docker images

on:
  push:
    branches: [dev, main]
    paths:
      - 'api/**'
      - 'web/**'
      - '.github/workflows/publish-images.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'api/**'
      - 'web/**'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Application checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_DB: agribridge_test
          POSTGRES_USER: agribridge
          # Disposable CI fixture, never used by local or deployed applications.
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agribridge -d agribridge_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: agribridge_test
      PGUSER: agribridge
      PGPASSWORD: ci-only-password
      PGSSL: 'false'
      REDIS_ENABLED: 'false'
      COOKIE_SECURE: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix api
          npm ci --prefix web
      - name: Lint both components
        run: |
          npm run lint --prefix api
          npm run lint --prefix web
      - name: API unit tests and coverage gate
        run: |
          npm run test:coverage --prefix api
          cp api/reports/junit.xml api/reports/unit-junit.xml
      - name: API integration tests against PostgreSQL
        run: |
          npm run test:integration --prefix api
          cp api/reports/junit.xml api/reports/integration-junit.xml
      - name: Web tests and production build
        run: |
          npm run test:coverage --prefix web
          npm run build --prefix web
      - name: Save test reports and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-check-reports
          retention-days: 14
          path: |
            api/reports/*.xml
            api/coverage/
            web/coverage/

  publish:
    name: Publish ${{ matrix.component }}
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Derive image identity
        id: identity
        env:
          COMPONENT: ${{ matrix.component }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Set the DOCKERHUB_USERNAME repository variable.' >&2; exit 1; }
          echo "image=docker.io/${DOCKERHUB_USERNAME}/agribridge-${COMPONENT}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./${COMPONENT}/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Enable ARM64 builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish the runtime image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.component }}
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.identity.outputs.image }}:sha-${{ github.sha }}
            ${{ steps.identity.outputs.image }}:${{ github.ref_name }}
          # Public artifact identity only; application secrets are runtime inputs.
          build-args: |
            APP_VERSION=${{ steps.identity.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.identity.outputs.created }}
            IMAGE_TAG=sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
            org.opencontainers.image.created=${{ steps.identity.outputs.created }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Verify public access and record the published digest
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          COMPONENT: ${{ matrix.component }}
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          curl --fail --silent --show-error "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/agribridge-${COMPONENT}/" | jq -e '.is_private == false'
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
          {
            echo "### Published ${COMPONENT}"
            echo "Image: ${IMAGE}:sha-${GITHUB_SHA}"
            echo "Branch alias: ${IMAGE}:${GITHUB_REF_NAME}"
            echo "Digest: ${DIGEST}"
            echo "Pull: docker pull ${IMAGE}@${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"
