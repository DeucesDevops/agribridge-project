# Explicit starter policy. See docs/PIPELINE.md for scope and limitations.
# Every selected policy is blocking; this is not Checkov's entire policy catalog.
check:
  # Terraform: prevent public bucket ACLs, static provider credentials and
  # unrestricted administrative ingress. OIDC discovery is public by design.
  - CKV_AWS_20
  - CKV_AWS_24
  - CKV_AWS_25
  - CKV_AWS_41
  - CKV_AWS_46
  # Kubernetes: disallow privileged containers and shared host namespaces.
  - CKV_K8S_16
  - CKV_K8S_17
  - CKV_K8S_18
  - CKV_K8S_19
  - CKV_K8S_33
  # Dockerfiles: non-root runtime, pinned tags, safe package/TLS handling.
  - CKV_DOCKER_1
  - CKV_DOCKER_3
  - CKV_DOCKER_4
  - CKV_DOCKER_5
  - CKV_DOCKER_6
  - CKV_DOCKER_7
  - CKV_DOCKER_8
  - CKV_DOCKER_9
  - CKV_DOCKER_10
  - CKV_DOCKER_11
  - CKV2_DOCKER_1
  - CKV2_DOCKER_2
  - CKV2_DOCKER_3
  - CKV2_DOCKER_4
  - CKV2_DOCKER_5
  - CKV2_DOCKER_6
  - CKV2_DOCKER_7
soft-fail: false
skip-path:
  - '(^|/)(node_modules|\.git|\.terraform|generated|coverage|dist)/'
