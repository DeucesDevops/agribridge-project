# Argo CD on the shared agribridge load balancer.
# Terraform overrides the hostname, the public URL and the ACM certificate ARN.
# TLS terminates on the ALB. The server speaks HTTP to the NodePort, same as Grafana.
# Calico pod IPs are not routable from the VPC, so the Service is a NodePort
# and the target type is instance.
#
# Dex and notifications stay off. There is no SSO connector and no notification
# sink, and the workers already run the application and the observability stack.
# The admin password is generated into argocd-initial-admin-secret. Read it
# with the command in the root README. Do not put a password in this file.
global:
  domain: argocd.agribridge.deuces.dev

configs:
  params:
    server.insecure: "true"
  cm:
    url: https://argocd.agribridge.deuces.dev
    timeout.reconciliation: 60s

dex:
  enabled: false

notifications:
  enabled: false

server:
  service:
    type: NodePort
  ingress:
    enabled: true
    ingressClassName: alb
    path: /
    pathType: Prefix
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: instance
      alb.ingress.kubernetes.io/group.name: agribridge
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/healthcheck-path: /healthz
      alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
      alb.ingress.kubernetes.io/success-codes: "200"
      external-dns.alpha.kubernetes.io/hostname: argocd.agribridge.deuces.dev
