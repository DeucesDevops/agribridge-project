# Production shape of the store the application chart creates.
# helm/agribridge/templates/external-secret.yaml renders this object and the
# ExternalSecret that reads AWS Secrets Manager. The secret name is
# agribridge/production. Read a value with:
#   aws secretsmanager get-secret-value --secret-id agribridge/production --query SecretString --output text
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: agribridge
  namespace: agribridge-production
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agribridge
  namespace: agribridge-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: agribridge
  target:
    name: agribridge-runtime
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: agribridge/production
