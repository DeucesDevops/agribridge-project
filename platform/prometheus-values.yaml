alertmanager:
  enabled: false
grafana:
  service:
    # Calico pod IPs are not routable from the VPC. The ALB uses instance targets,
    # so Grafana is a NodePort. terraform/modules/platform sets the same type.
    type: NodePort
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 400Mi
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
prometheus:
  prometheusSpec:
    retention: 2d
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1200Mi
    # Scrape every ServiceMonitor, including the application chart.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
