apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx
  namespace: agribridge
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;

        # ALB sends /api and /version directly to the API Service.
        # No Docker-specific resolver is needed in Kubernetes.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
