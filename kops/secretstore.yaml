apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: agribridge
spec:
  provider:
    aws:
      service: SecretsManager
      region: REPLACE_AWS_REGION
      # Uses the ESO controller's AWS workload identity. Scope that identity
      # to this application's secret. Do not grant AWS access to app pods.
