apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
  namespace: agribridge
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: api-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PGPASSWORD
      remoteRef:
        key: REPLACE_SECRETS_MANAGER_SECRET_NAME
        property: PGPASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: REPLACE_SECRETS_MANAGER_SECRET_NAME
        property: JWT_SECRET
    - secretKey: REDIS_URL
      remoteRef:
        key: REPLACE_SECRETS_MANAGER_SECRET_NAME
        property: REDIS_URL
