apiVersion: batch/v1
kind: Job
metadata:
  # Change the release suffix for each release. Job pod templates are immutable.
  name: api-migrate-replace-release-id
  namespace: agribridge
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: api-migrate
        app.kubernetes.io/part-of: agribridge
    spec:
      restartPolicy: Never
      serviceAccountName: agribridge
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.invalid/agribridge-api:REPLACE_IMAGE_TAG
          imagePullPolicy: IfNotPresent
          command: [node, -e]
          args:
            - "import('./src/migrate.js').then(m => m.runMigrations()).then(() => process.exit(0)).catch(e => { console.error(e); process.exit(1); })"
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
