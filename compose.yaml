x-build: &identity
  APP_VERSION: ${APP_VERSION:-dev}
  GIT_SHA: ${GIT_SHA:-unknown}
  BUILD_DATE: ${BUILD_DATE:-unknown}
  IMAGE_TAG: ${IMAGE_TAG:-local}
services:
  postgres:
    image: postgres:16.11-bookworm
    environment:
      POSTGRES_USER: agribridge
      POSTGRES_DB: agribridge
      POSTGRES_PASSWORD: ${PGPASSWORD:?copy .env.example to .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U agribridge']
      interval: 5s
      retries: 20
    ports: ['127.0.0.1:${PG_LOCAL_PORT:-5433}:5432']
  redis:
    image: redis:7.4.7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 10
  api:
    image: ${API_IMAGE:-agribridge-api}:${IMAGE_TAG:-local}
    build:
      context: api
      args: *identity
    environment:
      NODE_ENV: production
      PGHOST: postgres
      PGDATABASE: agribridge
      PGUSER: agribridge
      PGPASSWORD: ${PGPASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      SEED_PASSWORD: ${SEED_PASSWORD:?required}
      REDIS_URL: redis://redis:6379
      COOKIE_SECURE: 'false'
      RUN_MIGRATIONS: 'true'
      SEED_DEMO_DATA: 'true'
      SHUTDOWN_GRACE_MS: '10000'
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    stop_grace_period: 30s
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      start_period: 90s
      retries: 3
  web:
    image: ${WEB_IMAGE:-agribridge-web}:${IMAGE_TAG:-local}
    build:
      context: web
      args: *identity
    depends_on:
      api: {condition: service_healthy}
    ports: ['127.0.0.1:8080:8080']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  postgres-data:
